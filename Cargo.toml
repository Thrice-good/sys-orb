[package]
name = "sys-orb"
version = "0.1.0"
edition = "2021"
description = "低功耗系统占用悬浮球（egui，圆形透明窗口）"

[dependencies]
# 与 focus-timer 相同的精简 feature 组合
# 去掉 wgpu / accesskit / wayland / x11，换 OpenGL(glow) 后端
# system_fonts 必须保留，否则右键菜单中文变方块
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "system_fonts",
] }

# 系统指标不走 sysinfo：只用 Win32 原生的两个函数
# GetSystemTimes 取 CPU 累计时间差，GlobalMemoryStatusEx 取内存使用率
# 两者都是微秒级调用，且不引入任何额外的运行时依赖
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # DwmSetWindowAttribute：去掉 Win11 给所有顶层窗口强制画的那条 1px 描边
    "Win32_Graphics_Dwm",
    # GetWindowLongPtrW / SetWindowPos / SetWindowRgn：清掉残留边框样式、裁剪窗口形状
    "Win32_UI_WindowsAndMessaging",
    # CreateEllipticRgn：把窗口区域裁成圆形
    "Win32_Graphics_Gdi",
] }
# 从 eframe::Frame 取原生窗口句柄（Frame 实现了 HasWindowHandle）
raw-window-handle = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
